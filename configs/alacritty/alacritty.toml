general.import = ["~/.config/alacritty/dracula.toml"]

[env]
TERM = "xterm-256color"

[cursor]
thickness = 0.15
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Block"

[font]
size = 11.0

[font.normal]
family = "Source Code Pro"
style = "Regular"

[font.bold]
family = "Source Code Pro"

[font.italic]
family = "Source Code Pro"

[font.bold_italic]
family = "Source Code Pro"

[font.offset]
x = -1
y = -1

[font.glyph_offset]
x = 0
y = 0

[mouse]
hide_when_typing = true

[scrolling]
history = 500

[window]
decorations = "none"
dynamic_padding = false
dynamic_title = true
opacity = 0.7
title = "LinuxSucks"

[window.class]
general = "LinuxSucks"
instance = "LinuxSucks"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 2
y = 0

[window.position]
x = 0
y = 0
